<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LW Foundation | Redirecting</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --border: #222222;
            --accent: #ffffff;
            --text-dim: #666666;
            --transition-main: cubic-bezier(0.65, 0, 0.35, 1);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            overflow: hidden;
        }

        .split-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            align-items: center;
        }

        /* Left Side Entrance */
        .content-left {
            flex: 1;
            padding: 8%;
            text-align: left;
            border-right: 1px solid var(--border);
            z-index: 2;
            animation: gateLeft 1.2s var(--transition-main) forwards;
        }

        @keyframes gateLeft {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .label {
            font-size: 0.75rem;
            letter-spacing: 5px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 1rem;
            display: block;
            animation: fadeIn 1s ease forwards 0.8s;
            opacity: 0;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            line-height: 1;
            margin: 0;
            letter-spacing: -3px;
            text-transform: uppercase;
        }

        .new-link {
            margin-top: 2.5rem;
            display: inline-block;
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            position: relative;
            padding-bottom: 8px;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1s;
        }

        .new-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 30px;
            height: 2px;
            background: #fff;
            transition: width 0.3s ease;
        }

        .new-link:hover::after {
            width: 100%;
        }

        /* Right Side Entrance */
        .countdown-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--surface);
            position: relative;
            height: 100%;
            animation: gateRight 1.2s var(--transition-main) forwards;
        }

        @keyframes gateRight {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        /* Big Number Animation */
        .number-container {
            height: 25rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #big-number {
            font-size: clamp(12rem, 30vw, 25rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -15px;
            color: var(--accent);
            transition: transform 0.6s var(--transition-main), opacity 0.6s;
        }

        /* Class added via JS every second */
        .num-tick {
            animation: tick 0.6s var(--transition-main);
        }

        @keyframes tick {
            0% { transform: translateY(50px); opacity: 0; filter: blur(10px); }
            100% { transform: translateY(0); opacity: 1; filter: blur(0); }
        }

        /* Redirect Text Styling */
        .redirect-status {
            position: absolute;
            bottom: 40px;
            text-align: center;
            width: 100%;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1.4s;
        }

        .redirect-label {
            font-size: 0.8rem;
            letter-spacing: 8px;
            color: #fff;
            text-transform: uppercase;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100px;
            height: 2px;
            background: var(--border);
            margin: 15px auto;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #fff;
            left: -100%;
            animation: loading 5s linear forwards;
        }

        @keyframes loading {
            to { left: 0; }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .split-container { flex-direction: column; }
            .content-left { border-right: none; border-bottom: 1px solid var(--border); width: 100%; flex: 0.4; }
            .countdown-right { flex: 0.6; width: 100%; }
            #big-number { font-size: 10rem; }
            .number-container { height: 12rem; }
        }
    </style>
</head>
<body>

    <div class="split-container">
        <div class="content-left">
            <span class="label">System Migration</span>
            <h1>WE HAVE<br>MOVED.</h1>
            <a href="https://lwfoundation.xyz" class="new-link">LWFOUNDATION.XYZ</a>
        </div>

        <div class="countdown-right">
            <div class="number-container">
                <div id="big-number">5</div>
            </div>
            
            <div class="redirect-status">
                <span class="redirect-label">REDIRECTING</span>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 5;
        const countdownElement = document.getElementById("big-number");
        
        function updateNumber() {
            // Trigger animation
            countdownElement.classList.remove('num-tick');
            void countdownElement.offsetWidth; // trigger reflow
            countdownElement.classList.add('num-tick');
            
            countdownElement.innerHTML = timeLeft;
        }

        const timer = setInterval(function(){
            timeLeft -= 1;
            
            if(timeLeft <= 0){
                clearInterval(timer);
                updateNumber();
                setTimeout(() => {
                    window.location.href = "https://lwfoundation.xyz";
                }, 500);
            } else {
                updateNumber();
            }
        }, 1000);

        // Initial animation trigger
        window.onload = () => {
            setTimeout(updateNumber, 100);
        };
    </script>

</body>
</html>
